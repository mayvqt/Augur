name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Test And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check diff whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff-tree --check --root -r "${{ github.sha }}"
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/augur ./cmd/augur

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: augur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Test container entrypoint
        run: |
          data_dir="$(mktemp -d)"
          chmod 0777 "$data_dir"
          docker run --rm \
            --security-opt no-new-privileges:true \
            -e PUID=1234 \
            -e PGID=1235 \
            -v "$data_dir:/data" \
            augur:ci \
            sh -c 'test "$(id -u)" = 1234 && test "$(id -g)" = 1235 && test -f /data/config.json && touch /data/entrypoint-ok'
          test "$(stat -c '%u:%g' "$data_dir/entrypoint-ok")" = "1234:1235"
          test "$(stat -c '%u:%g' "$data_dir/config.json")" = "1234:1235"
          if docker run --rm -e PUID=0 augur:ci true; then
            echo "entrypoint unexpectedly allowed PUID=0"
            exit 1
          fi
