name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Test And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ] \
            && [ -n "$PR_BASE_SHA" ] \
            && [ -n "$PR_HEAD_SHA" ] \
            && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -n "$EVENT_BEFORE" ] \
            && [ "$EVENT_BEFORE" != "$zero_sha" ] \
            && [ -n "$EVENT_SHA" ] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null \
            && git cat-file -e "${EVENT_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$EVENT_BEFORE..$EVENT_SHA"
          elif [ -n "$EVENT_SHA" ] && git cat-file -e "${EVENT_SHA}^{commit}" 2>/dev/null; then
            git diff-tree --check --root -r "$EVENT_SHA"
          else
            echo "Unable to resolve commit for whitespace check"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Scan dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/augur ./cmd/augur

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: augur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Test container entrypoint
        run: |
          data_dir="$(mktemp -d)"
          chmod 0777 "$data_dir"
          docker run --rm \
            --security-opt no-new-privileges:true \
            -e PUID=1234 \
            -e PGID=1235 \
            -v "$data_dir:/data" \
            augur:ci \
            sh -c 'test "$(id -u)" = 1234 && test "$(id -g)" = 1235 && test -f /data/config.json && touch /data/entrypoint-ok'
          test "$(stat -c '%u:%g' "$data_dir/entrypoint-ok")" = "1234:1235"
          test "$(stat -c '%u:%g' "$data_dir/config.json")" = "1234:1235"
          for variable in PUID PGID; do
            for value in 0 00 000 -1 invalid; do
              if docker run --rm -e "$variable=$value" augur:ci true; then
                echo "entrypoint unexpectedly allowed $variable=$value"
                exit 1
              fi
            done
          done
